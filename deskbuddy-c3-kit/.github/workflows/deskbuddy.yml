name: Build DeskBuddy C3

on:
  push:
    branches:
      - deskbuddy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register board and build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/deskbuddy_register.py
          python scripts/build.py deskbuddy-c3 --language en-US

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: deskbuddy-c3-firmware
          path: build/merged-binary.bin
          if-no-files-found: error
